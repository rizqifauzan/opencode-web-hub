<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · opencode hub</title>
<style>
  :root { --bg:#fafafa; --card:#fff; --fg:#161616; --muted:#6b6b6b; --line:#e4e4e4; --accent:#2563eb; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0e10; --card:#17171a; --fg:#ececec; --muted:#9a9a9f; --line:#2a2a2f; --accent:#60a5fa; --danger:#f87171; } }
  * { box-sizing: border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; padding:16px }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; display:grid; gap:12px }
  h1 { margin:0 0 4px; font-size:18px }
  input, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg) }
  button { background:var(--accent); color:#fff; border-color:transparent; cursor:pointer; font-weight:600 }
  .err { color:var(--danger); min-height:1.4em; margin:0; font-size:13px }
</style>
</head>
<body>
<form id="f">
  <h1>opencode hub</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button>Masuk</button>
  <p class="err" id="err"></p>
</form>
<script>
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault()
    const res = await fetch("/hub/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) })
    if (res.ok) location.href = "/hub/"
    else document.getElementById("err").textContent = (await res.json()).error || "Gagal"
  }
</script>
</body>
</html>
